name: Check cinema showtimes

on:
  schedule:
    # Daily at 11:50 and 17:50 KST (02:50 and 08:50 UTC), aiming for alerts around 12:00 and 18:00
    # GitHub Actions scheduled runs can start several minutes (sometimes tens of minutes) late
    - cron: "50 2,8 * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a Telegram connection test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: megabox-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Telegram connection test
        if: ${{ inputs.test_message }}
        run: python cinema_alert.py --test-message

      - name: Check showtimes
        if: ${{ !inputs.test_message }}
        run: python cinema_alert.py

      - name: Save snapshot
        if: ${{ !inputs.test_message }}
        run: |
          # Public repos have scheduled workflows disabled after 60 days without activity,
          # so refresh a heartbeat file once a month
          date +%Y-%m > state/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update snapshot"
            git push
          fi
